<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Low Calculation</title>

<style>

/* ===== BODY ===== */
body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    height:100vh;
    background:url("https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3")
    no-repeat center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Dark Overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    z-index:-1;
}

/* ===== CARD ===== */
.container{
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.08);
    border-radius:18px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 35px rgba(0,0,0,0.7);
    border:1px solid rgba(255,255,255,0.2);
    width:420px;
}

h1{
    margin-bottom:25px;
}

/* INPUT */
input{
    width:85%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
    text-align:center;
}

/* BUTTON */
button{
    padding:14px 30px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    background:linear-gradient(45deg,#00e676,#00c853);
    color:white;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00e676;
}

/* RESULT */
.result{
    margin-top:25px;
    padding:18px;
    background:rgba(0,0,0,0.4);
    border-radius:12px;
    display:none;
}

.result h3{
    color:gold;
    margin-top:0;
}

.result p{
    font-size:18px;
    margin:12px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>Open - Low (3 Part)</h1>

<input type="number" id="openPrice" placeholder="Enter Open Price">

<input type="number" id="lowPrice" placeholder="Enter Low Price">

<br>

<button onclick="calculate()">Calculate</button>

<div class="result" id="resultBox">

<h3>Calculation Result</h3>

<p id="differenceValue"></p>
<p id="zValue"></p>
<p id="firstSR"></p>
<p id="secondSR"></p>

</div>

</div>

<script>

function calculate(){

    let open = parseFloat(document.getElementById("openPrice").value);
    let low = parseFloat(document.getElementById("lowPrice").value);

    if(isNaN(open) || isNaN(low)){
        alert("Please enter both values.");
        return;
    }

    // Difference
    let difference = Math.abs(open - low);

    // Divide into 3 Parts
    let part = difference / 3;

    // Highest Value
    let high = Math.max(open, low);

    // Levels
    let first = high - part;
    let second = high - (part * 2);

    // Show Result
    document.getElementById("resultBox").style.display = "block";

    document.getElementById("differenceValue").innerHTML =
        "Difference = <b>" + difference.toFixed(2) + "</b>";

    document.getElementById("zValue").innerHTML =
        "1 Part (Difference ÷ 3) = <b>" + part.toFixed(2) + "</b>";

    document.getElementById("firstSR").innerHTML =
        "1st Support / Resistance = <b>" + first.toFixed(2) + "</b>";

    document.getElementById("secondSR").innerHTML =
        "2nd Support / Resistance = <b>" + second.toFixed(2) + "</b>";
}

</script>

</body>
</html>
